const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function weekOf(day){return WEEKS.findIndex(w=>day>=w[1]&&day<=w[2]);}
function pick(){
  const q=new URLSearchParams(location.search).get("d");
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  for(const c of [h,q]){ if(c&&DAYS.some(x=>x.d===c)) return c; }
  const n=new Date(), t=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
  return DAYS.some(x=>x.d===t)?t:DAYS[0].d;
}
let cur=null;
function render(d,push){
  const x=DAYS.find(y=>y.d===d); if(!x) return; cur=d;
  const wi=weekOf(x.day);
  $("weeks").innerHTML=WEEKS.map((w,i)=>`<button class="wk${i===wi?" on":""}" data-w="${i}">${w[0]}</button>`).join("");
  $("days").innerHTML=DAYS.filter(y=>weekOf(y.day)===wi).map(y=>`<button class="dt${y.d===d?" on":""}${y.w==="주일"?" sun":""}" data-d="${y.d}"><b>${y.m}/${y.day}</b><span>${y.w}</span></button>`).join("");
  const sp=x.special?`<span class="sp">${esc(x.special)}</span>`:"";
  let h=`<div class="card"><p class="date">${x.m}월 ${x.day}일 (${x.w})${sp}</p>
  <p class="pass">${esc(x.p)}</p>
  <p class="src">본문 출처: 샛별큐티인 2026년 11월호 · 개역개정</p>
  <div class="btns">${x.vids.length?`<a class="btn p" href="${x.pl}" target="_blank" rel="noopener">▶ 전체 재생목록 (${x.vids.length}편)</a>`:""}<button class="btn s" id="cp">🔗 이 날 링크 복사</button></div></div>`;
  if(!x.vids.length) h+=`<p class="empty">이 날 본문 설교 영상을 찾지 못했습니다.</p>`;
  x.vids.forEach((v,i)=>{
    const tag=v.tag==="5"?`<span class="tag t5">[5인]</span>`:`<span class="tag to">[다른 설교자]</span>`;
    const part=v.part?`<span class="tag tp">(부분 일치)</span>`:"";
    h+=`<div class="v"><div class="th" data-v="${v.id}"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"><div class="play"></div></div>
    <div class="vi">${i+1}. ${tag}${part}<div class="vt">${esc(v.title)}</div><div class="vc">${esc(v.ch)}</div><div class="vn">${esc(v.note)}</div>
    <div class="vl"><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">YouTube 앱/사이트에서 열기 ↗</a></div></div></div>`;
  });
  $("main").innerHTML=h;
  $("cp").onclick=()=>{const u=location.origin+location.pathname+"#"+d;
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("링크를 복사했어요"),()=>{prompt("이 링크를 복사하세요",u);});};
  document.title=`${x.m}/${x.day}(${x.w}) ${x.p} · 11월 큐티인 설교 영상`;
  if(push!==false && location.hash!=="#"+d) history.replaceState(null,"",location.pathname+"#"+d);
  const on=document.querySelector(".dt.on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo(0,0);
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600);}
document.addEventListener("click",e=>{
  const w=e.target.closest(".wk"); if(w){const W=WEEKS[+w.dataset.w];render(DAYS.find(y=>y.day===W[1]).d);return;}
  const b=e.target.closest(".dt"); if(b){render(b.dataset.d);return;}
  const th=e.target.closest(".th"); if(th&&!th.querySelector("iframe")){
    th.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${th.dataset.v}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube"></iframe>`;}
});
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1)); if(h!==cur&&DAYS.some(x=>x.d===h)) render(h,false);});
render(pick(),!!(location.search||location.hash));
</script>
</body>
</html>
